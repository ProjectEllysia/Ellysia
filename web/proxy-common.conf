# Cabeceras comunes a todos los `location` que proxean a la API Flask.
# E7: antes estas 5 líneas estaban copiadas literal en cada `location` de
# cada `server` de nginx.conf (localhost:80, ellysia.es:443, api.ellysia.es:443)
# — una sola fuente aquí.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
