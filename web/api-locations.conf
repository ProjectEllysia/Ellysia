# Prefijos de la API que nginx reenvía a Flask.
#
# A15: esta lista estaba escrita DOS veces (un bloque `server` por cada origen
# que sirve el SPA) y ya había divergido: `/hygeia` nunca se añadió, y al
# estrenar la capa comercial faltaron también `/plans` y `/organizations`. La
# divergencia no da error — devuelve el `index.html` del SPA donde se esperaba
# JSON, y el cliente revienta con `Unexpected token '<'`.
#
# Tiene que seguir a `API/run.py:_register_blueprints`, que es la verdad. Al
# añadir un blueprint nuevo, este fichero es el único sitio que tocar por parte
# de nginx.
#
# OJO con dónde vive: NO puede ir en /etc/nginx/conf.d/, porque la imagen base
# hace `include /etc/nginx/conf.d/*.conf` dentro de `http{}` y una directiva
# `location` en ese contexto impide que nginx arranque. Por eso el Dockerfile
# lo copia a /etc/nginx/ a secas.
#
# Las formas `location = /x` son para los endpoints que existen SIN barra
# final (GET /plans, POST /plans, POST /organizations, GET /users,
# GET/PUT /system). El resto solo necesita la forma con prefijo.

location = /users         { proxy_pass http://Ellysia-API:5000/users;         include /etc/nginx/conf.d/proxy-common.conf; }
location = /system        { proxy_pass http://Ellysia-API:5000/system;        include /etc/nginx/conf.d/proxy-common.conf; }
location = /plans         { proxy_pass http://Ellysia-API:5000/plans;         include /etc/nginx/conf.d/proxy-common.conf; }
location = /organizations { proxy_pass http://Ellysia-API:5000/organizations; include /etc/nginx/conf.d/proxy-common.conf; }

location /users/          { proxy_pass http://Ellysia-API:5000/users/;         include /etc/nginx/conf.d/proxy-common.conf; }
location /system/         { proxy_pass http://Ellysia-API:5000/system/;        include /etc/nginx/conf.d/proxy-common.conf; }
location /oauth/          { proxy_pass http://Ellysia-API:5000/oauth/;         include /etc/nginx/conf.d/proxy-common.conf; }
location /themis/         { proxy_pass http://Ellysia-API:5000/themis/;        include /etc/nginx/conf.d/proxy-common.conf; }
location /aegis/          { proxy_pass http://Ellysia-API:5000/aegis/;         include /etc/nginx/conf.d/proxy-common.conf; }
location /iris/           { proxy_pass http://Ellysia-API:5000/iris/;          include /etc/nginx/conf.d/proxy-common.conf; }
location /acheron/        { proxy_pass http://Ellysia-API:5000/acheron/;       include /etc/nginx/conf.d/proxy-common.conf; }
location /hygeia/         { proxy_pass http://Ellysia-API:5000/hygeia/;        include /etc/nginx/conf.d/proxy-common.conf; }
location /plans/          { proxy_pass http://Ellysia-API:5000/plans/;         include /etc/nginx/conf.d/proxy-common.conf; }
location /organizations/  { proxy_pass http://Ellysia-API:5000/organizations/; include /etc/nginx/conf.d/proxy-common.conf; }
