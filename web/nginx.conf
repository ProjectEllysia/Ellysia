# ── localhost (fallback, sin SSL) ───────────────────────────────
# BORRAR CUANDO SE COMPRUEBE QUE TODO APUNTA A LOS NOMBRES DE DOMINIO
# Sigue funcionando como antes: SPA + proxy de API por path.
server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location = /users  { proxy_pass http://ellysia:5000/users;  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location = /system { proxy_pass http://ellysia:5000/system; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }

    location /users/    { proxy_pass http://ellysia:5000/users/;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /system/   { proxy_pass http://ellysia:5000/system/;   proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /oauth/    { proxy_pass http://ellysia:5000/oauth/;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /sentinel/ { proxy_pass http://ellysia:5000/sentinel/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /aegis/    { proxy_pass http://ellysia:5000/aegis/;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /acheron/  { proxy_pass http://ellysia:5000/acheron/;  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTP → HTTPS redirect (solo dominios reales) ───────────────
server {
    listen 80;
    server_name ellysia.es www.ellysia.es api.ellysia.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── ellysia.es  →  SPA (Vue) ──────────────────────────────────
server {
    listen 443 ssl http2;
    server_name ellysia.es www.ellysia.es;

    ssl_certificate     /etc/nginx/ssl/ellysia.crt;
    ssl_certificate_key /etc/nginx/ssl/ellysia.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── api.ellysia.es  →  Flask API ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.ellysia.es;

    ssl_certificate     /etc/nginx/ssl/ellysia.crt;
    ssl_certificate_key /etc/nginx/ssl/ellysia.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    location / {
        proxy_pass http://ellysia:5000;
    }

    location /aegis/quiz {
        proxy_pass http://ellysia:5000/aegis/quiz;
    }
}
