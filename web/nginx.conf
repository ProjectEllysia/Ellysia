server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── API proxy routes ──────────────────────────────────────────
    # S5: X-Forwarded-For/-Proto/-Host added alongside the existing
    # X-Real-IP — ProxyFix (run.py) reads the X-Forwarded-* family, not
    # X-Real-IP, to recover the real client IP/scheme/host behind this proxy.

    # Exact paths (no trailing slash) needed by SPA fetch() calls
    location = /users  { proxy_pass http://seq:5000/users;  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location = /system { proxy_pass http://seq:5000/system; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }

    # Sub-path API endpoints (trailing slash)
    location /users/    { proxy_pass http://seq:5000/users/;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /system/   { proxy_pass http://seq:5000/system/;   proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /oauth/    { proxy_pass http://seq:5000/oauth/;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /sentinel/ { proxy_pass http://seq:5000/sentinel/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /aegis/    { proxy_pass http://seq:5000/aegis/;    proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }
    location /acheron/  { proxy_pass http://seq:5000/acheron/;  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-Host $host; }

    # ── SPA fallback ──────────────────────────────────────────────
    # Ship index.html for any unknown path; Vue Router handles the rest.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
