# E7: gzip + límite de subida a nivel http (este fichero se incluye dentro
# del bloque http{} de la imagen base nginx:alpine vía conf.d/*.conf).
gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

# ponytail: límite fijo de subida (cubre adjuntos .eml de Iris y PDFs); si
# algún endpoint necesita más, subir aquí primero — el 413 de nginx llega
# antes que cualquier validación de Flask.
client_max_body_size 20m;

# ── localhost (fallback, sin SSL) ───────────────────────────────
# BORRAR CUANDO SE COMPRUEBE QUE TODO APUNTA A LOS NOMBRES DE DOMINIO
# Sigue funcionando como antes: SPA + proxy de API por path.
server {
    listen 80;
    server_name localhost 127.0.0.1;

    root /usr/share/nginx/html;
    index index.html;

    location = /users  { proxy_pass http://Ellysia-API:5000/users;  include /etc/nginx/conf.d/proxy-common.conf; }
    location = /system { proxy_pass http://Ellysia-API:5000/system; include /etc/nginx/conf.d/proxy-common.conf; }

    location /users/    { proxy_pass http://Ellysia-API:5000/users/;    include /etc/nginx/conf.d/proxy-common.conf; }
    location /system/   { proxy_pass http://Ellysia-API:5000/system/;   include /etc/nginx/conf.d/proxy-common.conf; }
    location /oauth/    { proxy_pass http://Ellysia-API:5000/oauth/;    include /etc/nginx/conf.d/proxy-common.conf; }
    location /themis/   { proxy_pass http://Ellysia-API:5000/themis/;   include /etc/nginx/conf.d/proxy-common.conf; }
    location /aegis/    { proxy_pass http://Ellysia-API:5000/aegis/;    include /etc/nginx/conf.d/proxy-common.conf; }
    location /iris/     { proxy_pass http://Ellysia-API:5000/iris/;     include /etc/nginx/conf.d/proxy-common.conf; }
    location /acheron/  { proxy_pass http://Ellysia-API:5000/acheron/;  include /etc/nginx/conf.d/proxy-common.conf; }

    # E7: assets con hash de Vite (dist/assets/*.[hash].js|css) — cache larga,
    # el hash del nombre ya invalida cuando cambia el contenido.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── HTTP → HTTPS redirect (solo dominios reales) ───────────────
server {
    listen 80;
    server_name ellysia.es www.ellysia.es api.ellysia.es;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── ellysia.es / localhost  →  SPA (Vue) ──────────────────────
server {
    listen 443 ssl http2;
    server_name ellysia.es www.ellysia.es localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/ssl/ellysia.crt;
    ssl_certificate_key /etc/nginx/ssl/ellysia.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /users  { proxy_pass http://Ellysia-API:5000/users;  include /etc/nginx/conf.d/proxy-common.conf; }
    location = /system { proxy_pass http://Ellysia-API:5000/system; include /etc/nginx/conf.d/proxy-common.conf; }

    location /users/    { proxy_pass http://Ellysia-API:5000/users/;    include /etc/nginx/conf.d/proxy-common.conf; }
    location /system/   { proxy_pass http://Ellysia-API:5000/system/;   include /etc/nginx/conf.d/proxy-common.conf; }
    location /oauth/    { proxy_pass http://Ellysia-API:5000/oauth/;    include /etc/nginx/conf.d/proxy-common.conf; }
    location /themis/   { proxy_pass http://Ellysia-API:5000/themis/;   include /etc/nginx/conf.d/proxy-common.conf; }
    location /aegis/    { proxy_pass http://Ellysia-API:5000/aegis/;    include /etc/nginx/conf.d/proxy-common.conf; }
    location /iris/     { proxy_pass http://Ellysia-API:5000/iris/;     include /etc/nginx/conf.d/proxy-common.conf; }
    location /acheron/  { proxy_pass http://Ellysia-API:5000/acheron/;  include /etc/nginx/conf.d/proxy-common.conf; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── api.ellysia.es  →  Flask API ──────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.ellysia.es;

    ssl_certificate     /etc/nginx/ssl/ellysia.crt;
    ssl_certificate_key /etc/nginx/ssl/ellysia.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    include /etc/nginx/conf.d/proxy-common.conf;

    location / {
        proxy_pass http://Ellysia-API:5000;
    }
}
