name: Tests

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+', 'proyecto/**']
  pull_request:
    branches: [main, 'v[0-9]+.[0-9]+', 'proyecto/**']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    env:
      # La configuración OAuth se lee en tiempo de import; el conftest también
      # las fija por defecto, pero se declaran aquí de forma explícita.
      JWT_SECRET_KEY: ci-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRY_MINUTES: "30"
      REFRESH_TOKEN_EXPIRY_DAYS: "7"
      FLASK_ENV: development
      CREATE_DATABASE: "false"
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            API/requirements.txt
            API/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q -m "not oracle"

  spa:
    name: SPA suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: '@projectellysia'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      # Se instala con pnpm y el lockfile CONGELADO porque es exactamente lo
      # que hace el build de produccion (web/Dockerfile). Antes la CI usaba
      # `npm install` sin lockfile: dos resolutores distintos, dos arboles de
      # dependencias posibles, y una CI en verde que no garantizaba que la
      # imagen se construyera. De hecho no la garantizo -- el lockfile se
      # quedo desincronizado al cambiar una dependencia y solo se descubrio
      # mirando el Dockerfile a mano.
      #
      # @projectellysia/acheron-core-web es privado, asi que la instalacion
      # necesita credencial; el GITHUB_TOKEN del workflow sirve porque el
      # paquete concede acceso de lectura a este repositorio.
      #
      # --trust-lockfile ancla la verificacion de cadena de suministro en el
      # lockfile en vez de re-aplicarla entrada por entrada. pnpm rechaza por
      # defecto los paquetes publicados en las ultimas 24 horas --defensa real:
      # si roban la cuenta de un mantenedor, esa ventana da tiempo a retirar la
      # version maliciosa-- y eso choca con consumir un paquete propio recien
      # publicado. La politica NO se desactiva: sigue aplicandose al resolver
      # dependencias nuevas, que es cuando entran. Aqui el lockfile ya esta
      # commiteado y revisado, que es el caso que la propia opcion documenta.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run SPA suites
        run: pnpm test

      - name: Build the SPA
        run: pnpm build
