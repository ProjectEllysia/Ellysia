name: Tests

on:
  push:
    branches: [main, 'v[0-9]+.[0-9]+', 'proyecto/**']
  pull_request:
    branches: [main, 'v[0-9]+.[0-9]+', 'proyecto/**']

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: API
    env:
      # La configuración OAuth se lee en tiempo de import; el conftest también
      # las fija por defecto, pero se declaran aquí de forma explícita.
      JWT_SECRET_KEY: ci-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRY_MINUTES: "30"
      REFRESH_TOKEN_EXPIRY_DAYS: "7"
      FLASK_ENV: development
      CREATE_DATABASE: "false"
      DEBUG: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            API/requirements.txt
            API/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q -m "not oracle"

  spa:
    name: SPA suites
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json esta en .gitignore, asi que no hay lockfile que
      # cachear ni con el que hacer `npm ci`.
      #
      # @projectellysia/acheron-core-web vive en GitHub Packages y el
      # repositorio es privado, asi que npm necesita credencial. El
      # GITHUB_TOKEN del propio workflow sirve porque el paquete concede
      # acceso de lectura a este repositorio; sin esa concesion la instalacion
      # falla con un 403 permission_denied.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Las nueve suites del SPA corren con node a secas y salen con codigo
      # distinto de cero al fallar. Entre ellas va test:acheron, que verifica
      # que la criptografia de la boveda sigue siendo interoperable con la
      # implementacion Java de AcheronCore.
      - name: Run SPA suites
        run: npm test
