# Workflow TEMPORAL y desechable.
#
# El lockfile de pnpm del SPA se quedo desincronizado al cambiar una
# dependencia, y regenerarlo exige autenticarse contra GitHub Packages porque
# @projectellysia/acheron-core-web es privado. Este workflow lo regenera usando
# el GITHUB_TOKEN del propio runner y lo publica como artefacto.
#
# Se borra en cuanto el lockfile este commiteado.
name: Regenerar lockfile

on:
  workflow_dispatch:
  push:
    branches: ['fix/web/build-de-produccion']

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Resolver dependencias y regenerar el lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar el lockfile como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: web/app/pnpm-lock.yaml
