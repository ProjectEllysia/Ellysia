name: Lybra Bench (nocturno)

# Las cifras que respaldan la confianza en el motor —precisión de la Fase R,
# concordancia con Nmap, tasa de falsos positivos por versión— se medían a mano,
# una vez, en un equipo concreto. Desde entonces nadie sabía si seguían siendo
# ciertas: cada cambio en un matcher, en un dissector o en el feed podía haberlas
# movido sin dejar rastro, y de hecho lo hizo — dos módulos de banco estuvieron
# rotos varios días sin que nada se pusiera rojo, porque no corrían en ninguna
# parte (ver #279).
#
# Este workflow es la parte de "banco de pruebas con integración continua" que
# faltaba. Va **aparte** del de tests a propósito: levanta una veintena de
# contenedores y tarda del orden de veinte minutos, así que no puede colgarse de
# cada push. Corre de noche y a mano.

on:
  schedule:
    # 03:15 UTC. La hora exacta da igual; que no sea en punto evita la avalancha
    # de trabajos programados que GitHub encola a las horas redondas.
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    # Veinte contenedores, cada uno con su instalación de paquetes, más los
    # escaneos de Nmap del banco de concordancia.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: API

    env:
      JWT_SECRET_KEY: ci-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRY_MINUTES: "30"
      REFRESH_TOKEN_EXPIRY_DAYS: "7"
      FLASK_ENV: development
      CREATE_DATABASE: "false"
      DEBUG: "false"
      # Sin Postgres: los bancos que necesitan base de conocimiento caen al
      # subconjunto congelado del repositorio (tests/oracle/frozen_kb.json.gz).
      # Es lo que hace que la medición sea reproducible fuera del equipo de
      # desarrollo, que era el problema entero de este ítem.
      POSTGRES_PORT: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            API/requirements.txt
            API/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Comprobar que hay Docker
        # Si el runner se quedara sin Docker, todos los bancos se saltarían y el
        # job saldría verde sin haber medido nada — que es exactamente el
        # resultado engañoso que este workflow existe para evitar.
        run: docker version --format '{{.Server.Version}}'

      - name: Precargar las imágenes del catálogo
        # Descargarlas dentro del test cuenta contra su propio timeout de
        # arranque y hace que un fallo de red se lea como "el objetivo no
        # respondió". Aquí se ve por lo que es.
        run: |
          for image in nginx:alpine httpd:2.4.49 alpine:latest redis:7 \
                       mariadb:11 dperson/samba polinux/snmpd \
                       instrumentisto/nmap debian:10 debian:11 debian:12 \
                       ubuntu:20.04 ubuntu:22.04 ubuntu:24.04; do
            docker pull --quiet "$image"
          done

      - name: Correr los bancos
        id: bench
        # ``-s`` para que los informes lleguen a la salida: el entregable de
        # estos bancos es el número, no el verde. ``--no-cov`` porque la
        # cobertura aquí no dice nada y cuesta.
        run: |
          set -o pipefail
          python -m pytest -m oracle -q -s --no-cov --tb=short 2>&1 | tee bench.log

      - name: Publicar las cifras en el resumen
        # Se ejecuta también cuando los bancos fallan: si la precisión se cae,
        # el número es justo lo que hay que poder mirar sin abrir el log.
        if: always()
        run: |
          {
            echo "## Cifras del motor Lybra"
            echo
            echo '```'
            grep -E "precisión|precisi|TOTAL|concordancia|cota inferior|KB del banco|falsos" bench.log || \
              echo "(ningún banco produjo cifras — revisa el log del paso anterior)"
            echo '```'
            echo
            echo "Medido en \`$(date -u '+%Y-%m-%d %H:%M UTC')\` sobre \`${GITHUB_SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar el log completo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lybra-bench-log
          path: API/bench.log
          retention-days: 30
