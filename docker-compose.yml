services:

  postgres:
    image: postgres:16-alpine
    container_name: PostgresEllysia
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-SecOps} -d $${POSTGRES_DB:-Ellysia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - secops-net
    profiles:
      - dev
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: OllamaEllysia
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - secops-net
    profiles:
      # E2: fuera del perfil "container" por defecto — scribe (generación IA)
      # usa OpenAI por defecto (ver SecOpsConfig.json), Ollama es opcional y
      # reserva 4-8GB de RAM que no caben en el presupuesto del VPS objetivo
      # (plans/improvements/saas-viability-plan.md §5). Levantarlo con
      # `docker compose --profile container --profile local-ai up -d`.
      - dev
      - local-ai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: RedisEllysia
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    # El healthcheck de abajo usa $$REDIS_PASSWORD, que se resuelve DENTRO del
    # contenedor. Sin esta variable de entorno estaba vacía, el ping salía
    # NOAUTH y el chequeo no podía pasar nunca: redis se quedaba "unhealthy"
    # para siempre y api/worker, que dependen de él con service_healthy, no
    # llegaban a arrancar. La interpolación de `command` la hace compose en el
    # host, así que aquella no delataba el problema.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      # E4: redis-cli sale con exit 0 incluso ante NOAUTH/WRONGPASS (no
      # propaga el error de protocolo al exit code) — el "|| redis-cli ping"
      # nunca hacía falta y el chequeo nunca podía fallar por contraseña mal
      # configurada. Se valida el contenido real de la respuesta.
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - secops-net
    profiles:
      - dev
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ellysia:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: Ellysia-API
    restart: unless-stopped
    env_file:
      - .env
    # traceroute (y el chequeo ICMP de alcanzabilidad) necesitan raw sockets
    # para leer las respuestas ICMP TTL-exceeded.
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:15000:5000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_HOST: http://ollama:11434
      TEMP_DIR: /app/temp
      LOG_DIR: /app/logs
      OUTPUT_DIR: /app/data
    volumes:
      - ellysia_data:/app/data
      - scan_temp:/app/temp
      - scan_logs:/app/logs
    networks:
      - secops-net
    profiles:
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ellysia-worker:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: Ellysia-Worker
    restart: unless-stopped
    env_file:
      - .env
    # traceroute necesita raw sockets para leer las respuestas ICMP TTL-exceeded.
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.modules.system.taskqueue.worker
    # E5: el HEALTHCHECK del Dockerfile pega a /system/say-hello — el worker
    # no sirve HTTP, así que se anula.
    healthcheck:
      disable: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_HOST: http://ollama:11434
      TEMP_DIR: /app/temp
      LOG_DIR: /app/logs
      OUTPUT_DIR: /app/data
    volumes:
      - ellysia_data:/app/data
      - scan_temp:/app/temp
      - scan_logs:/app/logs
    networks:
      - secops-net
    profiles:
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: Ellysia-Web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web/ssl:/etc/nginx/ssl:ro
      # certbot escribe el reto ACME aquí y nginx lo sirve por
      # /.well-known/acme-challenge/, que ya está declarado en nginx.conf.
      # Volumen con nombre, no bind mount: no hace falta que exista en el
      # host de antemano y los dos contenedores lo ven igual.
      #
      # rw, no ro: nginx solo LEE de aquí, pero el volumen es compartido y
      # certbot necesita ESCRIBIR el reto en él. Con :ro en los dos lados el
      # volumen queda de solo lectura para ambos y certbot no puede dejar el
      # fichero que nginx tiene que servir — comprobado en este mismo
      # despliegue: con :ro aquí, `mkdir` dentro de web daba
      # "Read-only file system".
      - certbot-webroot:/var/www/certbot
    depends_on:
      ellysia:
        condition: service_started
    networks:
      - secops-net
    profiles:
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Emite y renueva el certificado de Let's Encrypt contra el mismo nginx que
  # ya sirve /.well-known/acme-challenge/ en el puerto 80. No hace falta parar
  # "web" ni cambiar de proxy: certbot solo escribe ficheros, no escucha
  # ningún puerto.
  #
  # certonly --webroot, no el plugin de nginx: el plugin quiere editar la
  # configuración del servidor directamente, y aquí nginx.conf ya es la
  # fuente de verdad. certonly solo emite el certificado y lo deja en un
  # fichero; recargar nginx para que lo recoja es cosa nuestra.
  certbot:
    image: certbot/certbot:latest
    container_name: Ellysia-Certbot
    volumes:
      - ./web/ssl/letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot:rw
    networks:
      - secops-net
    profiles:
      - container
    # Sin acción por defecto: se invoca a demanda con
    #   docker compose --profile container run --rm certbot certonly ...
    # para la primera emisión, y desde un cron del host para la renovación.
    # Un "command: renew" en bucle aquí competiría con ese cron.
    #
    # Tiene que ser `command`, NO `entrypoint`. La imagen trae
    # ENTRYPOINT ["certbot"], así que los argumentos de `run` se le pasan a él.
    # Con `entrypoint: ["/bin/true"]` aquí, esos argumentos pasaban a ser
    # argumentos de /bin/true: el `certonly` de la documentación ejecutaba
    # `/bin/true certonly --webroot ...`, salía con código 0 y no emitía nada.
    # Un fallo mudo — sin error, sin salida, sin certificado — que solo se
    # nota mucho después, cuando nginx sigue sirviendo el autofirmado y los
    # agentes rechazan la conexión con "unknown authority".
    #
    # `--version` como acción por defecto: si algún `up` levanta el servicio,
    # imprime la versión y termina, en vez de quedarse esperando.
    command: ["--version"]

volumes:
  postgres_data:
    name: ellysia_postgres_data
    driver: local
  redis_data:
    name: ellysia_redis_data
  ollama_models:
    name: ellysia_ollama_models
  ellysia_data:
  scan_temp:
  scan_logs:
  certbot-webroot:

networks:
  secops-net:
    driver: bridge
