# Nombre del proyecto, fijado a proposito. Sin esto Compose lo deduce del
# directorio, asi que un checkout en ~/EllysiaServer da el proyecto
# "ellysiaserver" y uno en ~/ellysia da "ellysia" — y el nombre del proyecto es
# el prefijo de los volumenes y las redes.
#
# El despliegue real se creo como "ellysia". Ejecutar desde un directorio con
# otro nombre no da error: Compose crea un juego PARALELO de volumenes vacios
# (ellysiaserver_ellysia_data, ellysiaserver_scan_logs...) y trabaja contra
# ellos mientras los contenedores en marcha siguen montando los originales. Asi
# se perdio una emision de Let's Encrypt en la epoca de certbot: escribia el
# reto ACME en su volumen y nginx lo buscaba en el otro, devolviendo un 404 que
# no apuntaba a ninguna parte. Con Caddy el mismo error sale mas caro todavia:
# un caddy_data huerfano son los certificados perdidos y una reemision contra
# el limite de Let's Encrypt.
#
# postgres_data, redis_data, ollama_models y los dos de caddy se salvan de eso
# porque llevan `name:` explicito (sin prefijo de proyecto), pero eso es una red
# de seguridad para los datos, no una solucion: el resto de volumenes si se
# duplican.
name: ellysia

services:

  postgres:
    image: postgres:16-alpine
    container_name: PostgresEllysia
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    command: >
      postgres
      -c max_connections=100
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c log_min_duration_statement=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-SecOps} -d $${POSTGRES_DB:-Ellysia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - secops-net
    profiles:
      - dev
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ollama:
    image: ollama/ollama:latest
    container_name: OllamaEllysia
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    networks:
      - secops-net
    profiles:
      # E2: fuera del perfil "container" por defecto — scribe (generación IA)
      # usa OpenAI por defecto (ver SecOpsConfig.json), Ollama es opcional y
      # reserva 4-8GB de RAM que no caben en el presupuesto del VPS objetivo
      # (plans/improvements/saas-viability-plan.md §5). Levantarlo con
      # `docker compose --profile container --profile local-ai up -d`.
      - dev
      - local-ai
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: RedisEllysia
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    # El healthcheck de abajo usa $$REDIS_PASSWORD, que se resuelve DENTRO del
    # contenedor. Sin esta variable de entorno estaba vacía, el ping salía
    # NOAUTH y el chequeo no podía pasar nunca: redis se quedaba "unhealthy"
    # para siempre y api/worker, que dependen de él con service_healthy, no
    # llegaban a arrancar. La interpolación de `command` la hace compose en el
    # host, así que aquella no delataba el problema.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      # E4: redis-cli sale con exit 0 incluso ante NOAUTH/WRONGPASS (no
      # propaga el error de protocolo al exit code) — el "|| redis-cli ping"
      # nunca hacía falta y el chequeo nunca podía fallar por contraseña mal
      # configurada. Se valida el contenido real de la respuesta.
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping 2>/dev/null | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - secops-net
    profiles:
      - dev
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ellysia:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: Ellysia-API
    restart: unless-stopped
    env_file:
      - .env
    # traceroute (y el chequeo ICMP de alcanzabilidad) necesitan raw sockets
    # para leer las respuestas ICMP TTL-exceeded.
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:15000:5000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_HOST: http://ollama:11434
      TEMP_DIR: /app/temp
      LOG_DIR: /app/logs
      OUTPUT_DIR: /app/data
    volumes:
      - ellysia_data:/app/data
      - scan_temp:/app/temp
      - scan_logs:/app/logs
    networks:
      - secops-net
    profiles:
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ellysia-worker:
    build:
      context: ./API
      dockerfile: Dockerfile
    container_name: Ellysia-Worker
    restart: unless-stopped
    env_file:
      - .env
    # traceroute necesita raw sockets para leer las respuestas ICMP TTL-exceeded.
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.modules.system.taskqueue.worker
    # E5: el HEALTHCHECK del Dockerfile pega a /system/say-hello — el worker
    # no sirve HTTP, así que se anula.
    healthcheck:
      disable: true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      OLLAMA_HOST: http://ollama:11434
      TEMP_DIR: /app/temp
      LOG_DIR: /app/logs
      OUTPUT_DIR: /app/data
    volumes:
      - ellysia_data:/app/data
      - scan_temp:/app/temp
      - scan_logs:/app/logs
    networks:
      - secops-net
    profiles:
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: Ellysia-Web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # LA ÚNICA TRAMPA DE CADDY, y hay que tomársela en serio: en /data
      # viven los certificados emitidos y la clave de cuenta ACME. Si este
      # volumen no persiste, Caddy vuelve a emitir en CADA reinicio y agota
      # el límite de Let's Encrypt (5 certificados duplicados por semana),
      # dejando el sitio sin TLS válido hasta que la ventana pase. Es el
      # fallo más reportado de Caddy en producción.
      #
      # No hay bind mount ni copia a ninguna otra ruta: Caddy sirve el
      # certificado desde aquí directamente. Ese es justamente el paso que
      # desaparece respecto a nginx+certbot.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      ellysia:
        condition: service_started
    networks:
      - secops-net
    profiles:
      - container
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: ellysia_postgres_data
    driver: local
  redis_data:
    name: ellysia_redis_data
  ollama_models:
    name: ellysia_ollama_models
  ellysia_data:
  scan_temp:
  scan_logs:
  # `name:` explícito por la razón que explica la cabecera del fichero: un
  # checkout en un directorio con otro nombre no puede dejarlos huérfanos.
  # Aquí importa más que en ninguno — perder caddy_data es perder los
  # certificados y la clave de cuenta ACME, y reemitir contra el límite.
  caddy_data:
    name: ellysia_caddy_data # certificados y claves ACME — NO borrar
  caddy_config:
    name: ellysia_caddy_config

networks:
  secops-net:
    driver: bridge
