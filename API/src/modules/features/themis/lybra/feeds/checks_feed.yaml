      qod: 99
      confirmed: true
  - id: missing-x-content-type-options-header
    version: 1
    type: http
    category: security_header
    severity: LOW
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
              - 301
              - 302
          - type: word
            part: header
            words:
              - x-content-type-options
            negative: true
    finding:
      title: Cabecera X-Content-Type-Options ausente (permite MIME sniffing)
      qod: 99
      confirmed: true
  - id: tls-self-signed-cert
    version: 1
