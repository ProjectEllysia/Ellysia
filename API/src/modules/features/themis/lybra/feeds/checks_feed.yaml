  # expectBanner: un servidor FTP saluda (220 ...) en cuanto se abre la
  # conexion, sin que el cliente pida nada. Ese saludo hay que consumirlo antes
  # de escribir USER; si se deja en el buffer, la respuesta que se lee tras
  # USER es el saludo y no el 331, y el check no dispara jamas.
  # read: block — el saludo y las respuestas de FTP pueden venir en varias
  # lineas (220-... / 220 ...), asi que el fin de la respuesta es "la primera
  # linea cuyo codigo NO lleva guion", no "el primer salto de linea".
  - id: ftp-anonymous-login
    version: 2
    type: network
    category: default_credentials
    severity: HIGH
    service: ftp
    mode: safe
    expectBanner: true
    requests:
      - send: "USER anonymous\r\n"
        read: block
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '331'
      - send: "PASS anonymous@lybra.local\r\n"
        read: block
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - '230'
    finding:
      title: 'FTP: login anónimo permitido'
      qod: 99
      confirmed: true
  # Redis no saluda: no lleva expectBanner. Lo que si tiene es una respuesta
  # que no termina en el primer salto de linea — INFO devuelve un "bulk string"
  # RESP, es decir una linea con la longitud ($3116) seguida de esos bytes. Con
  # read: line se leia "$3116" y se buscaba redis_version ahi dentro, que
  # nunca esta. Una respuesta que no sea bulk (el error -NOAUTH, por ejemplo)
  # vuelve tal cual, que es justo lo que el matcher negativo necesita ver.
  - id: redis-unauthenticated-access
    version: 2
    type: network
    category: default_credentials
    severity: CRITICAL
    service: redis
    mode: safe
    requests:
      - send: "INFO\r\n"
        read: resp-bulk
        matchers-condition: and
        matchers:
          - type: word
            part: body
            words:
              - redis_version
          - type: word
            part: body
            words:
              - NOAUTH
            negative: true
    finding:
      title: 'Redis: acceso sin autenticación (comando INFO permitido)'
      qod: 99
      confirmed: true
  - id: smb-signing-not-required
    version: 1
    type: script
    script: smb-signing-not-required
    category: network_config
    severity: MEDIUM
    service: smb
    mode: safe
    finding:
      title: 'SMB: firma de mensajes no requerida'
      qod: 99
      confirmed: true
  # ------------------------------------------------------------------
  # APIs de administracion expuestas sin autenticar (L17).
  #
  # Los tres checks de aqui abajo comparten una forma y una razon. La forma:
  # un GET sin credenciales que exige un 200 con contenido reconocible del
  # producto. La razon: en estos tres servicios, que la peticion conteste
  # **es** el hallazgo, y de los graves.
  #
  # El 200 no es un adorno del matcher, es la mitad del check. Un 401 o un 403
  # significan que el servicio esta ahi y pide credenciales — que es como debe
  # estar — y por eso no producen hallazgo ninguno.
  - id: docker-api-unauthenticated
    version: 1
    type: http
    category: exposed_service
    severity: CRITICAL
    service: docker
    mode: safe
    requests:
      - method: GET
        path: /version
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - ApiVersion
              - GoVersion
    finding:
      title: API de Docker expuesta sin autenticacion (ejecucion remota de codigo como root)
      qod: 99
      confirmed: true
  - id: elasticsearch-unauthenticated
    version: 1
    type: http
    category: exposed_service
    severity: CRITICAL
    service: elasticsearch
    mode: safe
    requests:
