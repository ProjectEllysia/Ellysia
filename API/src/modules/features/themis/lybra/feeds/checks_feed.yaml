  - id: tls-deprecated-protocol
    version: 1
    type: tls
    category: tls
    severity: MEDIUM
    service: https
    mode: safe
    tlsRule: deprecated_protocol
    finding:
      title: Protocolo TLS obsoleto negociado (SSLv3/TLSv1.0/TLSv1.1)
