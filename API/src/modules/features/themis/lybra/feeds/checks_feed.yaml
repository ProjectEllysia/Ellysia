# Feed de checks declarativos de Lybra (roadmap Fase R).
#
# YAML y no JSON a proposito: es el formato de las plantillas de Nuclei, con
# las que este esquema se disena para ser razonablemente compatible, y admite
# comentarios — que en un feed de reglas es la diferencia entre poder explicar
# por que un check existe y no poder.
#
# feedVersion sube cuando el feed gana una familia nueva o un protocolo nuevo
# bajo una existente; el arreglo de un check ya presente sube el 'version' de
# ese check, no esta cadena. Ver CHECKS_FEED_VERSION en checks.py.
feedVersion: lybra-checks-11
checks:
  - id: git-config-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /.git/config
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - '[core]'
              - repositoryformatversion
    finding:
      title: Repositorio Git expuesto (.git/config accesible)
      qod: 99
      confirmed: true
  - id: dotenv-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
      - method: GET
        path: /.env
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: regex
            part: body
            regex:
              - (?m)^[A-Z][A-Z0-9_]*=
    finding:
      title: Fichero .env expuesto (posibles secretos accesibles)
      qod: 99
      confirmed: true
  - id: phpinfo-exposure
    version: 1
    type: http
    category: exposed_path
    severity: HIGH
    service: http
    mode: safe
    requests:
