        path: /_cluster/health
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
          - type: word
            part: body
            words:
              - cluster_name
              - number_of_nodes
    finding:
      title: Cluster de Elasticsearch accesible sin autenticacion (lectura y borrado de todos los indices)
      qod: 99
      confirmed: true
  - id: kubernetes-anonymous-api
