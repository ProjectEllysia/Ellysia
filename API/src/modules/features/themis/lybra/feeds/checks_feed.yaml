    finding:
      title: mod_status de Apache expuesto (server-status revela peticiones y rutas internas)
      qod: 99
      confirmed: true
  - id: missing-hsts-header
    version: 1
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: status
            value:
              - 200
              - 301
              - 302
          - type: word
            part: header
            words:
              - strict-transport-security
            negative: true
    finding:
      title: Cabecera HSTS (Strict-Transport-Security) ausente
      qod: 99
      confirmed: true
  - id: missing-x-frame-options-header
    version: 1
    type: http
    category: security_header
    severity: MEDIUM
    service: http
    mode: safe
    requests:
      - method: GET
        path: /
        matchers-condition: and
        matchers:
          - type: status
            value:
